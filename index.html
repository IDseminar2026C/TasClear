<!DOCTYPE html>
<!-- このページ全体が日本語であることをブラウザに伝えています -->
<html lang="ja">

<head>
  <!-- 文字化けを防ぐための設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンで見たときに、ちょうどよい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ブラウザのタブに表示される名前 -->
  <title>タスクリア</title>

  <!-- 見た目を決めるファイル（style.css）を読み込みます -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 中身を中央にまとめるための箱 -->
  <div class="container">

    <!-- ヘッダー：アプリのロゴ -->
    <header>
      <h1>⚔️ タスクリア</h1>

      <!-- プレイヤーのステータス。中身は JavaScript で書き換えます -->
      <!-- 左：アイコン、真ん中：レベル、右：経験値バー の順に横に並べます -->
      <div class="status">
        <!-- 左：プレイヤーのアイコン（称号の絵文字） -->
        <div id="status-icon" class="player-icon">🧑‍🌾</div>

        <!-- 真ん中：レベル（丸の中に数字）と称号の名前 -->
        <div class="level-box">
          <p class="level-label">Level</p>
          <p id="status-level" class="level-circle">1</p>
          <p id="status-name" class="status-name">見習い冒険者</p>
        </div>

        <!-- 右：経験値バー（外側の枠と、伸びる中身）と経験値の数字 -->
        <div class="exp-box">
          <div class="exp-bar">
            <div id="exp-bar-fill" class="exp-bar-fill"></div>
          </div>
          <p id="exp-text" class="exp-text">0 / 100 EXP</p>

          <!-- 今日の撃破数 -->
          <p id="today-count" class="today-count">今日 0体 撃破</p>
        </div>
      </div>
    </header>

    <!-- 主人公（勇者）のドット絵。絵は JavaScript で描きます -->
    <div class="hero-area">
      <!-- ランクの星（★ が今のランク、☆ が残り）。中身は JavaScript で書き換えます -->
      <p id="rank-stars" class="rank-stars">★☆☆☆☆☆☆</p>

      <canvas id="hero-canvas" class="hero-canvas" width="16" height="16" aria-label="勇者のドット絵"></canvas>
    </div>

    <!-- クエスト（タスク）の入力フォーム -->
    <form id="quest-form" class="quest-form">
      <input id="quest-input" type="text" placeholder="クエスト名を入力" autocomplete="off">
      <button type="submit">追加</button>
    </form>

    <!-- 本日のタスク：まだ撃破していない一番上のクエストを大きく表示します -->
    <section class="today-card">
      <h2 class="today-label">本日のタスク</h2>
      <!-- 中身は JavaScript で作ります -->
      <div id="today-quest" class="today-quest"></div>
    </section>

    <!-- 他のタスク：押すと、残りのクエストの一覧が閉じたり開いたりします -->
    <button id="other-toggle" class="other-toggle" type="button">他のタスク △</button>

    <!-- 残りのクエストの一覧（最初から開いている）。中身は JavaScript で作ります -->
    <ul id="quest-list" class="quest-list"></ul>

    <!-- 撃破済みのクエストをまとめて消すボタン（一覧が開いているときだけ見える） -->
    <button id="clear-done-button" class="clear-done-button" type="button">撃破済みをまとめて削除</button>

  </div>

  <!-- 演出用の板。画面全体にかぶさって、撃破したときだけ光って文字が出ます -->
  <div id="effect-overlay" class="effect-overlay">
    <p id="effect-text" class="effect-text"></p>
  </div>

  <!-- JavaScript のファイルを読み込みます（ページの最後に書きます） -->
  <script src="script.js"></script>
</body>

</html>
